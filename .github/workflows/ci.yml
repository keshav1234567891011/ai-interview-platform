name: InterviewAI validation
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.local/browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run build
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm --prefix frontend run test:e2e
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m venv --copies backend/.venv
      - run: backend/.venv/bin/pip install -r backend/requirements.txt
      - run: npm run test:dev-config
      - run: npm --prefix frontend run test:owner-integration
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      OPENAI_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements-dev.txt
      - run: .venv/bin/python -m ruff check app tests alembic
      - run: .venv/bin/python -m ruff format --check app tests alembic
      - run: .venv/bin/python -m pytest -q --basetemp=runtime/pytest-ci
      - run: .venv/bin/python -m app.migration_check
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t interviewai-backend:ci .
      - run: docker build -f frontend/Dockerfile -t interviewai-frontend:ci .
      - name: Smoke-test owned containers without production secrets
        run: |
          set -euo pipefail
          docker run --detach --name interviewai-backend-smoke -p 127.0.0.1:18000:8000 -e APP_ENV=test interviewai-backend:ci
          docker run --detach --name interviewai-frontend-smoke -p 127.0.0.1:13000:3000 interviewai-frontend:ci
          trap 'docker rm -f interviewai-backend-smoke interviewai-frontend-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:18000/health >/dev/null && curl --silent --fail http://127.0.0.1:13000/ >/dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:18000/health >/dev/null
          curl --silent --fail http://127.0.0.1:13000/ >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18000/ready)" = "503"
          docker exec interviewai-backend-smoke python -c "import os; assert os.getuid() != 0"
          docker exec interviewai-frontend-smoke node -e "if(process.getuid()===0)process.exit(1)"
